name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo and mint an ID token for the deploy step.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs wait rather than cancel, so main never
# publishes an older build over a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Storybook builds stories in a browser-free step, but the test project
      # needs Chromium. Only install it when the tests run.
      - run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run test
      - run: npm run test:storybook

      - run: npm run build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
